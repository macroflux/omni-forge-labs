# OmniDigest — Project Manifest
name: omnidigest
description: "Weather/news digest web page (PHP, no Composer)"

# repo_root is a path relative to omniforge/runner/forge.py.
# "../.." resolves to the repository root when forge.py is invoked from
# its own directory (omniforge/runner/).
repo_root: "C:/dev/omni-feed"

# Commands executed by the runner at each SDLC stage.
# Each entry is a shell command (string) or a dict {cmd, cwd}.
# Commands run from repo_root by default.
# The runner injects FORGE_RUN_DIR, FORGE_STAGE_DIR, FORGE_TICKET, and FORGE_PROJECT
# as environment variables — stages must write their artifact to
# $FORGE_STAGE_DIR/<artifact>.md to satisfy the artifact enforcement check.
stages:
  # Early stages: noop commands to enforce workspace docs are present.
  # Artifacts (intake.md, plan.md, etc.) are copied from runs/work/<ticket>/
  # by copy_workspace_to_run() before the stage loop starts.
  intake:
    - echo [omnidigest] Intake — snapshot workspace into run evidence...

  plan:
    - echo [omnidigest] Plan — ready for execution planning...

  design:
    - echo [omnidigest] Design — validating architecture notes...

  research:
    - echo [omnidigest] Research — validating tech choices...

  implement:
    - echo [omnidigest] Running build script...
    - php scripts/build_digest.php
    - php -r "file_put_contents(getenv('FORGE_STAGE_DIR').DIRECTORY_SEPARATOR.'implementation.md', \"# Implementation\n\nBuild script executed successfully.\n\");"

  test:
    - echo [omnidigest] Smoke test — verifying digest.json exists...
    - php -r "if(!file_exists('web/digest.json')) {fwrite(STDERR,\"digest.json missing\n\"); exit(1);} "
    - php -r "file_put_contents(getenv('FORGE_STAGE_DIR').DIRECTORY_SEPARATOR.'test_report.md', \"# Test Report\n\nSmoke tests passed.\n\");"

  integrate:
    - echo [omnidigest] Integration validation — checking digest structure...
    - php -r "$d=json_decode(file_get_contents('web/digest.json'), true); if(!$d || !isset($d['generated_at'],$d['categories'])) {fwrite(STDERR,\"digest.json invalid\n\"); exit(1);} "
    - php -r "file_put_contents(getenv('FORGE_STAGE_DIR').DIRECTORY_SEPARATOR.'integration_report.md', \"# Integration Report\n\nIntegration checks passed.\n\");"

  deliver:
    - echo [omnidigest] Final rebuild before packaging...
    - php scripts/build_digest.php
    - php -r "file_put_contents(getenv('FORGE_STAGE_DIR').DIRECTORY_SEPARATOR.'delivery.md', \"# Delivery\n\nOmniDigest ready for deployment.\n\");"

# Assertions run after each stage's commands and artifact check.
# Failures count as stage failures and trigger rollback.
asserts:
  implement:
    - type: file_exists
      path: "web/digest.json"

  integrate:
    - type: json_has_keys
      path: "web/digest.json"
      keys: ["generated_at", "categories"]
    - type: json_array_min_length
      path: "web/digest.json"
      key: "categories.Technology"
      min: 1
    - type: json_array_min_length
      path: "web/digest.json"
      key: "categories.AI"
      min: 1

  deliver:
    - type: file_exists
      path: "web/digest.json"

# Folders that Ember packages into the final delivery bundle.
artifact_folders:
  - web/
  - data/

# Optional: command used to serve the project locally for manual verification.
serve_command: "php -S localhost:8080 -t web/"
