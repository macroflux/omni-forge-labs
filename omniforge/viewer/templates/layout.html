<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>{{ title if title else "OmniForge Viewer" }}</title>
  <style>
    body { font-family: system-ui, Segoe UI, Arial, sans-serif; margin: 24px; }
    a { text-decoration: none; }
    .muted { opacity: .7; }
    table { border-collapse: collapse; width: 100%; margin-top: 12px; }
    th, td { border-bottom: 1px solid #ddd; padding: 8px; text-align: left; vertical-align: top; }
    code { background: #f3f3f3; padding: 2px 4px; border-radius: 4px; }
    .pill { display:inline-block; padding:2px 8px; border-radius:999px; background:#f3f3f3; }
    .row { display:flex; gap:18px; align-items:flex-start; }
    .card { border:1px solid #ddd; border-radius:10px; padding:12px 14px; }
    .card h3 { margin: 0 0 8px 0; }
    .btn { padding:6px 10px; border:1px solid #666; border-radius:8px; background:#fff; cursor:pointer; }
    .btn:hover { background:#f6f6f6; }
    .grid { display:grid; grid-template-columns: 1fr 1fr; gap: 14px; }
    pre { background:#0b0b0b; color:#eaeaea; padding:12px; border-radius:10px; overflow:auto; }
  </style>
</head>
<body>
  <div style="display:flex; align-items:baseline; justify-content:space-between;">
    <h1 style="margin:0;"><a href="{{ url_for('index') }}">OmniForge Viewer</a></h1>
    <div class="muted">Source: <code>runs/board.json</code></div>
  </div>
  <hr style="margin:16px 0;">
  {% block content %}{% endblock %}
</body>
</html>
